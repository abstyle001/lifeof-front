[package]
name = "lifeos"
version = "0.1.0"
description = "LifeOS personal data dashboard desktop application"
authors = ["AB-style"]
repository = "https://github.com/abstyle001/lifeof-front"
edition = "2021"
rust-version = "1.85"

[lib]
name = "lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-http = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
